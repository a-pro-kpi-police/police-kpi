services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kpi
      POSTGRES_USER: kpi
      POSTGRES_PASSWORD: kpi
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kpi -d kpi"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend-golang
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KPI_DATABASE_URL: postgres://kpi:kpi@postgres:5432/kpi?sslmode=disable
      KPI_DEBUG: "1"
      KPI_SEED_MODE: monthly_import
      KPI_MONTHLY_IMPORT_PATH: /app/import_data/monthly_kpi_2026_07.csv
      KPI_UPLOAD_DIR: /data/uploads
    ports:
      - "8000:8000"
    volumes:
      - backend_uploads:/data/uploads

  frontend:
    build:
      context: ./frontend
    working_dir: /app
    command: npm run dev -- --host 0.0.0.0 --port 5173
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      - backend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  postgres_data:
  backend_uploads:
  frontend_node_modules:
